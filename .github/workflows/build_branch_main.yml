name: Build branch main

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  bake-latest:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Docker Setup QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all
      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (full)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/docker-py3-kms/Dockerfile
          platforms: linux/amd64,linux/386,linux/arm64/v8,linux/arm/v7,linux/arm/v6
          push: true
          # the tag "python3" is for backward compatibility only
          tags: |
            dockerbuild01/py-kms:main
            ghcr.io/openwrtbuild/py-kms:main
            dockerbuild01/py-kms:main-full
            ghcr.io/openwrtbuild/py-kms:main-full
            dockerbuild01/py-kms:python3
            ghcr.io/openwrtbuild/py-kms:python3
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
            BUILD_REFERENCE=${{ github.ref_name }}
      - name: Build (minimal)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/docker-py3-kms-minimal/Dockerfile
          platforms: linux/amd64,linux/386,linux/arm64/v8,linux/arm/v7,linux/arm/v6
          push: true
          # the tag "minimal" is for backward compatibility only
          tags: |
            dockerbuild01/py-kms:latest
            ghcr.io/openwrtbuild/py-kms:latest
            dockerbuild01/py-kms:main-minimal
            ghcr.io/openwrtbuild/py-kms:main-minimal
            dockerbuild01/py-kms:minimal
            ghcr.io/openwrtbuild/py-kms:minimal
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
            BUILD_REFERENCE=${{ github.ref_name }}
